version: 2

models:
  - name: stg_tenants
    columns:
      - name: tenant_id
        tests: [unique, not_null]

  - name: stg_carriers
    columns:
      - name: carrier_id
        tests: [unique, not_null]
      - name: tenant_id
        tests: [not_null]

  - name: stg_programs
    columns:
      - name: program_id
        tests: [unique, not_null]
      - name: tenant_id
        tests: [not_null]

  - name: stg_program_carrier_shares
    columns:
      - name: program_carrier_share_id
