        tests: [not_null]

  - name: stg_policy_coverages
    columns:
      - name: policy_coverage_id
        tests: [unique, not_null]
      - name: tenant_id
        tests: [not_null]

  - name: stg_policy_transactions
    columns:
      - name: policy_transaction_id
        tests: [unique, not_null]
      - name: tenant_id
        tests: [not_null]

  - name: stg_claims
    columns:
      - name: claim_id
        tests: [unique, not_null]
