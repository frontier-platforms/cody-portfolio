        tests: [not_null]

  - name: stg_insureds
    columns:
      - name: insured_id
        tests: [unique, not_null]
      - name: tenant_id
        tests: [not_null]

  - name: stg_policies
    columns:
      - name: policy_id
        tests: [unique, not_null]
