# Weekly production run of every Lab pipeline, orchestrated by Airflow.
# GitHub Actions is the scheduler: it runs the lab_refresh DAG once with
# `airflow dags test` (airflow/dags/lab_refresh.py). No Airflow server to host.
#
#   extract (Python) → load bronze → dbt build (models, tests, contracts)
#   → train the value model (scikit-learn) + dbt docs → publish
#
# An error-level dbt test fails the DAG before anything is published, so the
# site keeps serving last week's data. Vercel redeploys on the commit.
name: Refresh Lab data

on:
  schedule:
    - cron: "0 10 * * 1" # Mondays 10:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --group airflow

      # Finished games never change, so keep their play-by-play between runs.
      - uses: actions/cache@v4
        with:
          path: .cache/data/nhl-gamecenter-*
          key: nhl-pbp-${{ github.run_id }}
          restore-keys: nhl-pbp-

      - name: Run the Airflow DAG
        run: sh scripts/airflow-test.sh

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data lib/pipelines/generated public/dbt-docs
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "data: weekly refresh"
          git push
